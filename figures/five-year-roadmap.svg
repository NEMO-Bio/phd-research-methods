<text class="s" x="40" y="472">贯穿全部阶段的 6 项能力：问题感 / 论证与建模 / 证据与方法 / 执行与留痕 / 表达与协作 / 元认知</text>
<text class="s" x="40" y="500">进展矩阵共有 30 个“阶段 × 能力”证据格，季度复盘只更新有作品或行为证据的格子。</text>
